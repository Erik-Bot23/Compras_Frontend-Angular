<!-- 
  CATEGORIAS - CRUD simple
  sidebar.menuOpen del SidebarService (singleton).
  [class.collapsed]="!sidebar.menuOpen" → transicion 800ms ease-in-out.
  <div class="table-container fade-in"> anima entrada de tabla 250ms.
-->
<div class="layout" [class.collapsed]="!sidebar.menuOpen">
    <app-sidebar (toggle)="sidebar.menuOpen = $event"></app-sidebar>

  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de categorías</h2>

        <!--Formulario (crear o editar)-->
        <div class="form-card" *ngIf="auth.hasPermission('CREAR_CATEGORIAS') || auth.hasPermission('EDITAR_CATEGORIAS')">
            <div class="field">
                <label>{{ editingCategoryId ? 'Nombre de la categoría (edición)' : 'Nombre de la categoría' }}</label>
                <input [(ngModel)]="categoryName">
            </div>

            <button (click)="saveCategory()">{{ editingCategoryId ? 'Actualizar' : 'Guardar' }}</button>
            <button *ngIf="editingCategoryId" class="cancel" (click)="cancelEdit()">Cancelar</button>
        </div>

        <!-- Estructura de tabla responsive (clases compartidas en styles.css):
           .table-card  → tarjeta visual oscura con bordes redondeados.
           .table-scroll → scroll horizontal si la ventana es muy pequena.
           thead/tbody separados permiten el header sticky de styles.css. -->
        <div class="table-container fade-in">
            <div class="table-card">
                <div class="table-scroll">
                    <table>
                        <thead>
                            <tr>
                                <th>Categoria</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody>
                            <!-- pipe 'paginate: page : pageSize' recorta la lista
                                 a una pagina → nada de scroll infinito -->
                            <tr *ngFor="let c of categories | paginate: page : pageSize">
                                <td>{{ c.name }}</td>
                                <td>
                                    <!-- Contenedor flex de botones: gap en vez de margenes sueltos -->
                                    <div class="table-actions">
                                        <!--
                                          editRole → edit: en categorias.css solo existen .edit (amarillo) y .delete (rojo),
                                          la clase anterior no tenia estilo asignado. Mismo patron visual que productos/usuarios.
                                        -->
                                        <button *hasPermission="'EDITAR_CATEGORIAS'" class="edit" (click)="editCategory(c)">
                                            Editar
                                        </button>
                                        <button *hasPermission="'ELIMINAR_CATEGORIAS'" (click)="deleteCategory(c.id)" class="delete">
                                            Eliminar
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pie de tabla con paginacion -->
                <app-pagination
                    [total]="categories.length"
                    [pageSize]="pageSize"
                    [page]="page"
                    (pageChange)="page = $event">
                </app-pagination>
            </div>
        </div> 
  </main>
</div>
