<!-- 
  PRODUCTOS - CRUD productos con imagen
  sidebar.menuOpen viene del SidebarService (singleton compartido).
  [class.collapsed]="!sidebar.menuOpen" alterna .collapsed en .layout
  → transicion CSS: width 800ms ease-in-out en .sidebar.
  <div *ngIf="!loading" class="table-container fade-in">
    aplica animacion fade-in-up 250ms al terminar carga HTTP.
-->
<div class="layout" [class.collapsed]="!sidebar.menuOpen">
  <!-- Sidebar emite @Output() toggle → padre actualiza sidebar.menuOpen del servicio -->
  <app-sidebar (toggle)="sidebar.menuOpen = $event"></app-sidebar>
  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de Productos</h2>

    <div class="main-grid">
      <!-- FORMULARIO -->
      <div class="form-card" *ngIf="auth.hasPermission('CREAR_PRODUCTOS') || auth.hasPermission('EDITAR_PRODUCTOS')">
        <div class="field">
          <label>Nombre del producto</label>
          <input [(ngModel)]="form.name" />
        </div>

        <div class="field">
          <label>Precio</label>
          <input 
            [(ngModel)]="form.price"
            min="1"
            (input)="validateNumber('price')"
            type="number"
          />
        </div>

        <div class="field">
          <label>Stock</label>
          <input 
            [(ngModel)]="form.stock"
            min="0"
            (input)="validateNumber('stock')"
            type="number"
          />
        </div>

        <div class="field">
          <label>Categoría</label>
          <div class="category-row">
            <select [(ngModel)]="form.categoryId" class="custom-select">
              <!--let c of: -->
              <option *ngFor="let c of categories" [value]="c.id"> <!--*ngFor: -->
                {{ c.name }}
              </option>
            </select>

            <button type="button" class="add-category" (click)="categorias()">
              +
            </button>
          </div>
        </div>

        <div class="field">
          <label>SKU</label>
          <input [(ngModel)]="form.sku" />
        </div>

        <div class="field">
          <label>Barcode</label>
          <input [(ngModel)]="form.barcode" />
        </div>

        <div class="field">
          <label>Imagen del producto</label>
          <!--#fileInput: -->
          <!--(change): -->
          <!--$event: -->
          <!--accept: -->
          <input 
            #fileInput 
            type="file"
            accept="image/*"
            (change)="onFileSelected($event)"
            class="file-input"
          />
        </div>

        <button type="button" (click)="save()" [disabled]="isSaving">
          <!--{{ isSaving ? 'Guardando...' : 'Guardar' }}-->
           <!--?-->
           <!--:-->
           {{ form.id ? 'Actualizar producto' : 'Guardar producto' }}
        </button>

        <!--
          Boton cancelar: solo en modo edicion (editingProductId != null).
          cancelEdit() = resetForm() → limpia el formulario y quita el id,
          el formulario vuelve a modo "crear". Mismo patron que categorias.
        -->
        <button type="button" *ngIf="editingProductId" class="cancel" (click)="cancelEdit()">
          Cancelar
        </button>
      </div>

      <!-- LISTADO -->
      <div *ngIf="loading">
        Cargando productos...
      </div>

      <!--*ngIf: -->
      <!-- Estructura de tabla responsive (clases compartidas en styles.css):
           .table-container   → wrapper de layout del componente (flex column).
           .table-card        → tarjeta visual oscura con bordes redondeados.
           .table-scroll      → area con scroll horiz/vertical en pantallas pequenas.
           Si el usuario solo ve (sin crear/editar), esta div es el unico hijo del
           grid y el CSS (:only-child) la expande a todo el ancho de la pagina. -->
      <div *ngIf="!loading" class="table-container fade-in">
        <div class="table-card">
          <!-- Barra de filtros: dropdown con las categorias existentes.
               [ngValue] preserva el number del id (con [value] llegaria string
               y la comparacion === del getter fallaria).
               (ngModelChange) resetea la pagina al cambiar el criterio. -->
          <div class="table-filter-bar">
            <div class="table-filter-field">
              <label for="filterCategory">Filtrar por categoría</label>
              <select class="filter-select" id="filterCategory" [(ngModel)]="selectedCategory" (ngModelChange)="onCategoryFilterChange()">
                <option [ngValue]="null">Todas</option>
                <option *ngFor="let c of categories" [ngValue]="c.id">{{ c.name }}</option>
              </select>
            </div>
          </div>

          <div class="table-scroll">
            <table class="product-table">
              <thead>
                <tr>
                  <th>Imagen</th>
                  <th>Nombre</th>
                  <th>Precio</th>
                  <th>Stock</th>
                  <th>Categoría</th>
                  <th>SKU</th>
                  <th>Barcode</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody>
                <!-- El getter 'filteredProducts' aplica el filtro de categoria
                     y el pipe 'paginate' recorta el resultado a una pagina. -->
                <tr *ngFor="let p of filteredProducts | paginate: page : pageSize">
                  <td><img [src]="imageUrl(p.img)" alt="{{ p.name }}" class="img"></td>
                  <td>{{ p.name }}</td>
                  <td>${{ p.price }}</td>
                  <td>{{ p.stock }}</td>
                  <td>{{ p.categoryName }}</td>
                  <td>{{ p.sku }}</td>
                  <td>{{ p.barcode }}</td>
                  <td>
                    <!-- Contenedor flex de botones: gap en vez de margenes sueltos -->
                    <div class="table-actions">
                      <button *hasPermission="'EDITAR_PRODUCTOS'" type="button" (click)="editProduct(p)" class="edit">Editar</button>
                      <button *hasPermission="'ELIMINAR_PRODUCTOS'" type="button" (click)="deleteProduct(p.id)" class="delete">Eliminar</button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pie de tabla con paginacion:
               total = longitud de la lista FILTRADA (no la completa); page/
               pageSize = estado del componente. (pageChange)="page = $event"
               guarda la pagina elegida. -->
          <app-pagination
            [total]="filteredProducts.length"
            [pageSize]="pageSize"
            [page]="page"
            (pageChange)="page = $event">
          </app-pagination>
        </div>
      </div>
    </div>
  </main>
</div>
