<!-- 
  ROLES - CRUD roles + permisos agrupados
  sidebar.menuOpen del SidebarService (singleton).
  [class.collapsed]="!sidebar.menuOpen" → transicion 800ms ease-in-out.
  <div class="table-container fade-in"> anima entrada de tabla 250ms.
-->
<div class="layout" [class.collapsed]="!sidebar.menuOpen">
    <app-sidebar (toggle)="sidebar.menuOpen = $event"></app-sidebar>

    <!-- CONTENIDO -->
    <main class="content">
        <h2>Gestión de roles</h2>

        <div class="roles-layout">
            <!--FORMULARIO-->
            <div class="form-panel" *ngIf="auth.hasPermission('CREAR_ROLES') || auth.hasPermission('EDITAR_ROLES')">
                <div class="form-card">
                    <div class="field">
                        <label>Nombre del rol</label>
                        <input [(ngModel)]="roleName">
                    </div>

                    <div class="permission-section">
                        <div class="permission-group" *ngFor="let group of groupedPermissions | keyvalue">
                            <h4>
                                {{ group.key }} 
                            </h4>

                            <label class="permission-item" *ngFor="let permission of group.value">
                                <input type="checkbox" [checked]="hasPermissionSelected(permission.name)"
                                    (change)="togglePermission(permission.name)">

                                {{ formatPermissionName(permission.name) }}
                            </label>
                        </div>
                    </div>

                    <button (click)="saveRole()">
                        {{ editingRoleId ? 'Actualizar rol' : 'Guardar rol'}}
                    </button>
                </div>
            </div>

            <!-- Panel de la tabla:
           .table-panel → area flexible que toma todo el ancho restante del flex
                (cuando el formulario de permisos no existe, ocupa el 100%).
           .table-container/.table-card/.table-scroll → estructura de tabla
                responsive compartida (styles.css). -->
            <div class="table-panel">
                <div class="table-container fade-in">
                    <div class="table-card">
                        <div class="table-scroll">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Rol</th>
                                        <th>Permisos</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>

                                <tbody>
                                    <!-- pipe 'paginate: page : pageSize' recorta la lista a una pagina -->
                                    <tr *ngFor="let c of roles | paginate: page : pageSize">
                                        <td>{{ c.name }}</td>
                                        <td>{{ c.permissions.length }} permisos</td>
                                        <td>
                                            <!-- Contenedor flex de botones: gap en vez de margenes sueltos -->
                                            <div class="table-actions">
                                                <button *hasPermission="'EDITAR_ROLES'" class="editRole" (click)="editRole(c)">
                                                    Editar
                                                </button>
                                                <button *hasPermission="'ELIMINAR_ROLES'" class="delete" (click)="deleteRole(c.id)">
                                                    Eliminar
                                                </button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pie de tabla con paginacion -->
                        <app-pagination
                            [total]="roles.length"
                            [pageSize]="pageSize"
                            [page]="page"
                            (pageChange)="page = $event">
                        </app-pagination>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
