<!-- 
  USUARIOS - CRUD usuarios + roles
  sidebar.menuOpen del SidebarService (singleton).
  [class.collapsed]="!sidebar.menuOpen" → transicion 800ms ease-in-out.
  <div *ngIf="!loading" class="table-container fade-in"> anima tabla 250ms.
-->
<div class="layout" [class.collapsed]="!sidebar.menuOpen">
  <app-sidebar (toggle)="sidebar.menuOpen = $event"></app-sidebar>

  <!-- CONTENIDO -->
  <main class="content">
    <h2>Gestión de usuarios</h2>

    <div class="main-grid">
      <!-- FORMULARIO -->
    <div class="form-card" *ngIf="auth.hasPermission('CREAR_USUARIOS') || auth.hasPermission('EDITAR_USUARIOS')">
        <div class="field">
          <label>Nombre del usuario</label>
          <input [(ngModel)]="form.name" />
        </div>

        <div class="field">
          <label>Correo del usuario</label>
          <input [(ngModel)]="form.email"/>
        </div>

        <div class="field">
          <label>Contraseña</label>
          <input 
            [(ngModel)]="form.password" type="password"/>
        </div>

        <div class="field">
          <label>Rol</label>
          <select [(ngModel)]="form.roleId" class="custom-select">
            <option *ngFor="let role of roles" [value]="role.id">
              {{ role.name }}
            </option> 
          </select>
        </div>

        <button type="button" (click)="save()" [disabled]="isSaving">
          <!--{{ isSaving ? 'Guardando...' : 'Guardar' }}-->
           {{ form.id ? 'Actualizar usuarios' : 'Guardar usuario' }}
        </button>

        <!--
          Boton cancelar: solo en modo edicion (editingUserId != null).
          cancelEdit() = resetForm() → limpia el formulario y quita el id
          (si se edito, password queda vacio para no mostrar la anterior).
          Mismo patron que categorias.
        -->
        <button type="button" *ngIf="editingUserId" class="cancel" (click)="cancelEdit()">
          Cancelar
        </button>
      </div>

      <!-- LISTADO -->
      <div *ngIf="loading">
        Cargando usuarios...
      </div>

      <!-- Estructura de tabla responsive (clases compartidas en styles.css):
           .table-container → wrapper de layout (flex column).
           .table-card      → tarjeta visual oscura con bordes redondeados.
           .table-scroll    → scroll horiz/vertical en pantallas pequenas.
           Si el usuario solo ve, esta div es el unico hijo del grid y el CSS
           (:only-child) la expande a todo el ancho de la pagina. -->
      <div *ngIf="!loading" class="table-container fade-in">
        <div class="table-card">
          <!-- Barra de filtros: solo rol (esta tabla lista unicamente activos).
               [ngValue] preserva el number para la comparacion estricta del
               getter filteredUsers. (ngModelChange) resetea la pagina. -->
          <div class="table-filter-bar">
            <div class="table-filter-field">
              <label for="filterRole">Filtrar por rol</label>
              <select class="filter-select" id="filterRole" [(ngModel)]="selectedRole" (ngModelChange)="onFilterChange()">
                <option [ngValue]="null">Todos</option>
                <option *ngFor="let r of roles" [ngValue]="r.id">{{ r.name }}</option>
              </select>
            </div>

            <!-- Acceso a la vista de usuarios dados de baja. margin-left:auto
                 (clase .deactivated-link) lo empuja al extremo derecho. -->
            <button type="button" class="deactivated-link" (click)="verDesactivados()">
              Ver desactivados
            </button>
          </div>

          <div class="table-scroll">
            <table class="product-table">
              <thead>
                <tr>
                  <th>Nombre</th>
                  <th>Correo</th>
                  <th>Rol</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody>
                <!-- El getter 'filteredUsers' aplica rol+estado y el pipe
                     'paginate' recorta el resultado a una pagina. -->
                <tr *ngFor="let p of filteredUsers | paginate: page : pageSize">
                  <td>{{ p.name }}</td>
                  <td>{{ p.email }}</td>
                  <td>{{ p.roleName }}</td>
                  <td>
                    <!-- Contenedor flex de botones: gap en vez de margenes sueltos.
                         Solo "Dar de baja": el alta de un usuario inactivo se hace
                         desde /usuarios-desactivados (esta tabla solo lista activos). -->
                    <div class="table-actions">
                      <button *hasPermission="'EDITAR_USUARIOS'" type="button" (click)="editUser(p)" class="edit">Editar</button>

                      <button *hasPermission="'DESACTIVAR_USUARIOS'" type="button" (click)="deactivateUser(p.id)" class="delete">
                        Dar de baja
                      </button>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Pie de tabla con paginacion: total = lista FILTRADA -->
          <app-pagination
            [total]="filteredUsers.length"
            [pageSize]="pageSize"
            [page]="page"
            (pageChange)="page = $event">
          </app-pagination>
        </div>
      </div>
    </div>
  </main>
</div>
