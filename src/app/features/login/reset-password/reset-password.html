<div class="container">
  <form class="card" (ngSubmit)="save()">
    <h2>Nueva contraseña</h2>

    <input type="password" name="password" placeholder="Nueva contraseña" [(ngModel)]="password">
    <input type="password" name="confirmPassword" placeholder="Confirmar contraseña" [(ngModel)]="confirmPassword">

    <button type="submit">
      Guardar
    </button>

  </form>
</div>
