server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real (/cobro, /productos, /caja...)
    # cae en index.html para que Angular resuelva la ruta (evita 404 al recargar).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Archivos con hash (Angular usa outputHashing: all en produccion) -> cache larga.
    location ~* \.(js|css|ttf|woff2|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Headers de seguridad (hardening barato)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}